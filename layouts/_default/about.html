{{ define "main" }}
{{ $p := site.Params.profile }}
<div class="pf">
  <div class="pf-about pf-first">
    <aside class="pf-about-side">
      <img class="pf-avatar" src="{{ site.Params.header.logo | relURL }}" alt="{{ $p.name }}">
      <p class="pf-about-name">{{ $p.name }}</p>
      <p class="pf-about-role">{{ $p.role }}</p>
      <div class="pf-about-links">
        <a href="#contact">Contact</a>
        {{ range site.Params.social_media.items }}{{ if .enabled }}<a href="{{ .link }}" target="_blank" rel="noopener">{{ .title }}</a>{{ end }}{{ end }}
        {{ with $p.resume }}<a href="{{ . | relURL }}">Résumé</a>{{ end }}
      </div>
    </aside>
    <article>
      <h1 class="pf-h1">{{ .Title }}</h1>
      <div class="prose prose-slate dark:prose-invert prose-quoteless pf-prose">{{ .Content }}</div>
      {{ partial "contact-block.html" . }}
    </article>
  </div>
</div>
{{ end }}
